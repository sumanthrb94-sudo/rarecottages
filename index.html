<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rare Cottages — Stay . Relax . Celebrate | Rajahmundry</title>
    <meta
      name="description"
      content="Book farm houses, villas, party spaces and event venues in and around Rajahmundry. Night stays, hourly stays, birthday packages, cakes, decor and photography — all in one place."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved light/dark mode before first paint (see src/lib/theme.tsx).
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('rc-mode') || 'system'; } catch (e) {}
        var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#ffffff');
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rare Cottages" />
    <meta property="og:title" content="Rare Cottages — Stay . Relax . Celebrate" />
    <meta
      property="og:description"
      content="Farm houses, villas, party and event spaces in and around Rajahmundry."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "name": "Rare Cottages",
        "slogan": "Stay . Relax . Celebrate",
        "areaServed": "Rajahmundry, Andhra Pradesh, India",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rajahmundry",
          "addressRegion": "Andhra Pradesh",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
